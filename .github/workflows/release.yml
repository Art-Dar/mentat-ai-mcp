name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package, e.g. v2.0'
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install, check, test and build
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Package with lock file and commit id
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          test -d dist
          rm -rf stage && mkdir stage
          cp -r dist package.json package-lock.json stage/
          echo "$SHA" > stage/COMMIT
          (cd stage && zip -qr "$GITHUB_WORKSPACE/mentat-mcp-${TAG}-${SHA:0:7}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: mentat-mcp-${{ env.TAG }}
          path: mentat-mcp-*.zip
          retention-days: 90

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" \
              --notes "Built from commit $(git rev-parse HEAD)"
          gh release upload "$TAG" mentat-mcp-*.zip --clobber